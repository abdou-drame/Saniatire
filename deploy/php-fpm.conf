; PHP-FPM pour la production (voir deploy/start.sh). Les ${VARIABLES} sont
; lues dans l'environnement : start.sh les calcule d'après la mémoire du
; conteneur, ou elles peuvent être fixées dans Dokploy.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; Le conteneur tourne en root (comme php artisan serve avant), lancé avec -R.
user = root
group = root

listen = /tmp/php-fpm.sock
listen.mode = 0666

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
; Recycle chaque worker après 500 requêtes (limite les fuites mémoire).
pm.max_requests = 500

; Indispensable : sinon les variables d'environnement Dokploy (DB_*, APP_KEY…)
; ne parviennent pas à Laravel.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

; Une requête bloquée plus de 120 s est interrompue.
request_terminate_timeout = 120s
