# nixpacks.toml — Configuration Nixpacks pour le backend Laravel

[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "php82Extensions.pgsql",
  "php82Extensions.pdo_pgsql",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.bcmath",
  "php82Extensions.gd",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.tokenizer",
  "php82Extensions.ctype",
  "php82Extensions.fileinfo",
  "php82Extensions.openssl",
  "php82Extensions.intl",
  # Serveur HTTP de production devant PHP-FPM (voir deploy/start.sh).
  "nginx"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
# deploy/start.sh applique les migrations (deploy:migrate) avant tout trafic
# — si elles échouent, le conteneur ne démarre pas —, puis lance Nginx +
# PHP-FPM sur le port 8080 (requêtes traitées en parallèle). Repli
# automatique sur php artisan serve si Nginx/PHP-FPM ne démarrent pas ;
# SERVER_MODE=artisan dans les variables Dokploy force ce repli.
cmd = "bash deploy/start.sh"